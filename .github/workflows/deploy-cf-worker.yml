name: Deploy Vietlott Browser Worker to Cloudflare
on:
  push:
    branches: [ "main" ]
    paths:
      - "cf-worker/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy Worker via Wrangler
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: "cf-worker"
        command: deploy

    - name: Set AUTH_TOKEN secret on Worker
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        workingDirectory: "cf-worker"
        command: secret put AUTH_TOKEN
        secrets: |
          AUTH_TOKEN
      env:
        AUTH_TOKEN: ${{ secrets.WORKER_AUTH_TOKEN }}
